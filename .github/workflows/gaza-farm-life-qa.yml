name: GAZA Farm Life QA
on:
  pull_request:
    paths: ['apps/gaza/**', '.github/workflows/gaza-farm-life-qa.yml']
  push:
    branches: [main]
    paths: ['apps/gaza/**', '.github/workflows/gaza-farm-life-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farm-life-${{ github.ref }}
  cancel-in-progress: true
jobs:
  farm-life:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gaza
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Anatomy, weights and common process regression
        run: |
          node --check runtime/farm/life/controls.mjs
          node --check runtime/farm/viewer.mjs
          node --test tests/farm-life.test.mjs tests/farm-life-review.test.mjs tests/farm-zamora.test.mjs tests/farm-refinement.test.mjs tests/process-ledger.test.mjs tests/lab-detail.test.mjs tests/plant-detail.test.mjs tests/plant-stock.test.mjs tests/site-real-core.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev >/tmp/farm-life-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/farm-labs.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/farm-life-http.log
          exit 1
      - name: Live farm browser and screenshots
        run: node tests/farm-life-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-farm-life-${{ github.run_number }}
          path: apps/gaza/.qa/farm-life/
          include-hidden-files: true
          retention-days: 14
