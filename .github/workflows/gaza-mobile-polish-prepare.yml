name: Prepare GAZA mobile lighting corrections
on:
  push:
    branches: [feat/gaza-mobile-motion-20261013]
    paths: ['tools/gaza/mobile-polish-prepare.mjs', '.github/workflows/gaza-mobile-polish-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'HectorLobatoHernandez/HectorLobatoHernandez.github.io' && github.ref == 'refs/heads/feat/gaza-mobile-motion-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 24
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify known baseline identity drift without changing legacy tests
        run: |
          python3 - <<'PY'
          import subprocess,json,hashlib,pathlib
          base='0575cd2b3d5376185c250fe5494c35a75cdd5228'
          paths=['xxxia-studio/projects/sound-club-palma/05_metadata/project-media.json','cv/present.html','cv/tests/visual-qa.mjs','.github/workflows/sound-club-visuals-qa.yml']
          records=[]
          for p in paths:
            old=subprocess.check_output(['git','show',base+':'+p]); now=pathlib.Path(p).read_bytes()
            records.append({'path':p,'unchangedFromBase':old==now,'baseSha256':hashlib.sha256(old).hexdigest(),'currentSha256':hashlib.sha256(now).hexdigest()})
            assert old==now, 'Legacy contract changed: '+p
          media=json.loads(subprocess.check_output(['git','show',base+':'+paths[0]]))
          oldtest=subprocess.check_output(['git','show',base+':'+paths[3]]).decode()
          present=subprocess.check_output(['git','show',base+':'+paths[1]]).decode()
          cvtest=subprocess.check_output(['git','show',base+':'+paths[2]]).decode()
          assert media['projectId']=='SOUND_CLUB_CDM' and "m['projectId']=='MAR_SALADA_CDM'" in oldtest
          assert 'OBSIDIAN_EDITORIAL' in present and "state.present.palette!=='IVORY_ATLAS'" in cvtest
          report={'base':base,'description':'Existing legacy expectation conflicts; not a passing visual test or waiver','files':records,'actualSoundProjectId':media['projectId'],'actualSoundPublicTitle':media['publicTitle'],'legacySoundExpectedId':'MAR_SALADA_CDM','actualPresentationPalette':'OBSIDIAN_EDITORIAL','legacyPresentationExpectedPalette':'IVORY_ATLAS'}
          pathlib.Path('.qa/mobile-polish').mkdir(parents=True,exist_ok=True)
          pathlib.Path('.qa/mobile-polish/legacy-contract-evidence.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Prepare exact source and test all core suites without moving refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/gaza/mobile-polish-prepare.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-mobile-polish-${{ github.run_number }}
          path: .qa/mobile-polish/
          include-hidden-files: true
          retention-days: 2
