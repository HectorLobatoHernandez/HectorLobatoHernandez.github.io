name: RHB STUDIO React Case QA
on:
  pull_request:
    paths:
      - 'projects/rhb-studio.html'
      - 'assets/js/rhb-studio-case.js'
      - 'assets/css/rhb-studio-case.css'
      - 'assets/visuals/rhb-*.svg'
      - 'rhb-studio/**'
      - 'skills/rhb-studio-project/**'
      - '.github/workflows/rhb-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rhb-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifests and assets
        run: |
          node --check assets/js/rhb-studio-case.js
          node --check rhb-studio/tests/rhb-studio-qa.mjs
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          p=json.load(open('rhb-studio/metadata/project-manifest.json',encoding='utf-8'))
          m=json.load(open('rhb-studio/metadata/model-manifest.json',encoding='utf-8'))
          assert p['projectId']=='RHB_STUDIO'
          assert p['classification']=='PUBLIC_SHOWCASE'
          assert len(p['modules'])==6
          assert len(p['referenceProjects'])==2
          assert p['runtimeBoundary']['secretsPublished'] is False
          assert p['runtimeBoundary']['portsPublished'] is False
          assert m['projectId']=='RHB_STUDIO'
          assert len(m['models'])==3
          assert all(x['status']=='PENDING_GLB' and not x['src'] for x in m['models'])
          for path in [
            'assets/visuals/rhb-monogram.svg',
            'assets/visuals/rhb-studio-workflow.svg',
            'assets/visuals/rhb-agent-routing.svg',
            'assets/visuals/rhb-gate-case.svg',
            'assets/visuals/rhb-table-case.svg'
          ]: ET.parse(path)
          print('RHB manifests and SVG assets OK')
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          python3 -m http.server 4196 --directory . > /tmp/rhb-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4196/projects/rhb-studio.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/rhb-http.log
          exit 1
      - name: Run RHB QA
        run: node rhb-studio/tests/rhb-studio-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhb-studio-qa
          path: .qa/rhb-studio/
          if-no-files-found: ignore
          retention-days: 15
