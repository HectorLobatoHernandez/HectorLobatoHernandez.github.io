name: GAZA visual QA

on:
  push:
    branches: [main]
    paths:
      - 'apps/gaza/**'
      - '.github/workflows/gaza-visual-qa.yml'
      - 'tools/blender/**'
      - 'tools/BUILD_GAZA_GLBS.ps1'
  pull_request:
    paths:
      - 'apps/gaza/**'
      - '.github/workflows/gaza-visual-qa.yml'
      - 'tools/blender/**'
      - 'tools/BUILD_GAZA_GLBS.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaza-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gaza
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source and asset manifest
        run: |
          node --check ./tests/visual-qa.mjs
          node --check ./tests/manifest-qa.mjs
          python -m py_compile ../../tools/blender/GAZA_BUILD_WORKER_GLBS.py
          npm run qa:manifest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local twin
        run: |
          npm run dev > /tmp/gaza-http.log 2>&1 &
          echo $! > /tmp/gaza-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/game.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gaza-http.log
          exit 1
      - name: Run deterministic visual QA
        run: npm run qa
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaza-visual-qa-${{ github.run_number }}
          path: apps/gaza/.qa/
          if-no-files-found: warn
          retention-days: 14
