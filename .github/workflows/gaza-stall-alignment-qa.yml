name: GAZA cattle cubicle alignment QA
on:
  pull_request:
    paths: ['apps/gaza/runtime/farm/**', 'apps/gaza/tests/farm-stall-alignment*', '.github/workflows/gaza-stall-alignment-qa.yml']
  push:
    branches: [main]
    paths: ['apps/gaza/runtime/farm/**', 'apps/gaza/tests/farm-stall-alignment*', '.github/workflows/gaza-stall-alignment-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cattle-stall-alignment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/gaza
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Cubicle geometry and actual instance matrices
        run: node --test tests/farm-stall-alignment.test.mjs tests/farm-life.test.mjs tests/farm-zamora.test.mjs tests/process-ledger.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          npm run dev >/tmp/stall-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/farm-labs.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stall-http.log
          exit 1
      - name: Browser and screenshots of both stall rows
        run: node tests/farm-stall-alignment-browser-qa.mjs
      - name: Check deployed farm alignment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GAZA_PUBLIC_BASE: https://hectorlobatohernandez.github.io/apps/gaza
        run: node tests/farm-stall-alignment-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-stall-alignment-${{ github.run_number }}
          path: apps/gaza/.qa/stall-alignment/
          include-hidden-files: true
          retention-days: 14
