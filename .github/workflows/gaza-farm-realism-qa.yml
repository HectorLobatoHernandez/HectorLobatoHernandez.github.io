name: GAZA farm realism QA
on:
  pull_request:
    paths: ['apps/gaza/**', '.github/workflows/gaza-farm-realism-qa.yml']
  push:
    branches: [main]
    paths: ['apps/gaza/**', '.github/workflows/gaza-farm-realism-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gaza-farm-realism-${{ github.ref }}
  cancel-in-progress: true
jobs:
  realism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gaza
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate projections and anatomy
        run: |
          node --check runtime/farm/realism-world.mjs
          node --check runtime/farm/herd-panel.mjs
          node --check runtime/farm/viewer.mjs
          node --test tests/farm-realism.test.mjs tests/farm-polish.test.mjs tests/farm-zamora.test.mjs tests/farm-refinement.test.mjs tests/process-ledger.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          npm run dev >/tmp/gaza-farm-realism-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/farm-labs.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gaza-farm-realism-http.log
          exit 1
      - name: Browser and screenshots
        run: node tests/farm-realism-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-farm-realism-${{ github.run_number }}
          path: apps/gaza/.qa/farm-realism/
          include-hidden-files: true
          retention-days: 14
