name: GAZA verified renderer preparation
on:
  push:
    branches: ['fix/gaza-dossier-demo-entry-20261012']
    paths: ['tools/gaza/prepare_three_vendor.mjs', 'tools/gaza/prepare_demo_release.mjs', '.github/workflows/gaza-vendor-prepare.yml']
permissions:
  contents: read
jobs:
  verified-blobs:
    if: github.repository == 'HectorLobatoHernandez/HectorLobatoHernandez.github.io' && github.ref == 'refs/heads/fix/gaza-dossier-demo-entry-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify upstream files and store immutable Git blobs only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/gaza/prepare_three_vendor.mjs
      - name: Prepare versioned reviewed demo sources without changing refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/gaza/prepare_demo_release.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-three-verified-blobs-${{ github.run_number }}
          path: |
            .qa/three-vendor/
            .qa/demo-release/
          include-hidden-files: true
          retention-days: 7
