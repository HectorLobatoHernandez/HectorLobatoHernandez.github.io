name: Project Atlas / real source media QA
on:
  pull_request:
    paths:
      - 'projects/**'
      - 'assets/projects/**'
      - 'assets/css/project-atlas.css'
      - 'assets/css/project-source-room.css'
      - 'assets/js/project-atlas.js'
      - 'assets/js/project-source-room.js'
      - 'index.html'
      - 'cv/dossier.html'
      - 'README.md'
      - '.github/workflows/sound-club-visuals-qa.yml'
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'assets/projects/**'
      - 'assets/css/project-atlas.css'
      - 'assets/css/project-source-room.css'
      - 'assets/js/project-atlas.js'
      - 'assets/js/project-source-room.js'
      - 'index.html'
      - 'cv/dossier.html'
      - 'README.md'
      - '.github/workflows/sound-club-visuals-qa.yml'

jobs:
  project-atlas-real-source-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate real-source Project Atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [
            'projects/mar-salada.html',
            'projects/casa-alain.html',
            'projects/can-furnet-club.html',
            'projects/playa-soleil-bora-bora.html',
            'projects/private-production-studio-canada.html',
            'projects/private-production-studio-london.html',
            'projects/acoustic-studio-italy.html',
            'projects/private-producer-acoustic-concept.html',
          ]
          assets = [
            'assets/projects/mar-salada/source.webp',
            'assets/projects/casa-alain/source.webp',
            'assets/projects/casa-alain/preview.mp4',
            'assets/projects/can-furnet/source.webp',
            'assets/projects/playa-soleil/source.webp',
            'assets/projects/studio-canada/source.webp',
            'assets/projects/studio-london/source.webp',
            'assets/projects/studio-italy/source.webp',
            'assets/projects/producer-concept/source.webp',
          ]

          atlas = Path('projects/index.html').read_text(encoding='utf-8')
          assert 'PROJECT ATLAS' in atlas
          assert 'private-production-studio-london.html' in atlas
          assert 'private-production-studio-sta-eulalia.html' not in atlas
          assert 'source.webp' in atlas

          for page in pages:
            text=Path(page).read_text(encoding='utf-8')
            assert 'window.PROJECT_ATLAS_DATA=' in text, page
            assert 'window.PROJECT_SOURCE_MEDIA=' in text, page
            assert 'project-source-room.css' in text, page
            assert 'project-source-room.js' in text, page
            assert 'boundary' in text.lower(), page

          mar=Path('projects/mar-salada.html').read_text(encoding='utf-8')
          assert 'MAR SALADA / CLUB DEL MAR' in mar
          assert 'KNX / ETS6' in mar and 'DALI' in mar
          assert 'mar-salada-immersive-v3' not in mar
          assert 'DIAGRAMMATIC_3D' not in mar

          assert not Path('assets/css/mar-salada-immersive-v3.css').exists()
          assert not Path('assets/js/mar-salada-immersive-v3.js').exists()

          london=Path('projects/private-production-studio-london.html').read_text(encoding='utf-8')
          assert 'London' in london and 'Santa Eulalia' not in london
          legacy=Path('projects/private-production-studio-sta-eulalia.html').read_text(encoding='utf-8')
          assert 'private-production-studio-london.html' in legacy

          for asset in assets:
            p=Path(asset)
            assert p.exists() and p.stat().st_size>100, asset

          source_js=Path('assets/js/project-source-room.js').read_text(encoding='utf-8')
          assert "REAL_SOURCE_MEDIA_ONLY" in source_js
          assert "UI_ONLY_NOT_PROJECT_GEOMETRY" in source_js

          print('REAL SOURCE PROJECT ATLAS checks pass')
          PY

      - name: JavaScript syntax
        run: |
          node --check assets/js/project-atlas.js
          node --check assets/js/project-source-room.js

      - name: Static route smoke test
        run: |
          python3 -m http.server 4194 --directory . >/tmp/project-atlas-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4194/projects/ >/dev/null && break
            sleep 1
          done
          for p in mar-salada casa-alain can-furnet-club playa-soleil-bora-bora private-production-studio-canada private-production-studio-london acoustic-studio-italy private-producer-acoustic-concept; do
            curl -fsS "http://127.0.0.1:4194/projects/$p.html" | grep -q 'PROJECT_SOURCE_MEDIA'
          done
          curl -fsS http://127.0.0.1:4194/assets/projects/casa-alain/preview.mp4 >/dev/null
          curl -fsS http://127.0.0.1:4194/assets/projects/mar-salada/source.webp >/dev/null
