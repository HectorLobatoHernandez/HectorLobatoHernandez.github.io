name: MAR SALADA React Case QA
on:
  pull_request:
    paths:
      - 'projects/mar-salada.html'
      - 'projects/sound-club-palma.html'
      - 'projects/sound-club-visuals.html'
      - 'assets/visuals/sound-club-*.svg'
      - 'assets/visuals/mar-salada-*.svg'
      - 'assets/css/mar-salada-case.css'
      - 'assets/js/mar-salada-case.js'
      - 'assets/css/mar-salada-case-v2.css'
      - 'assets/js/mar-salada-case-v2.js'
      - 'assets/css/sound-club-react-visuals.css'
      - 'assets/js/sound-club-react-visuals.js'
      - 'skills/mar-salada-project/**'
      - 'skills/mar-salada-react-scroll/**'
      - 'skills/react-visuals/**'
      - 'skills/reactbits-portfolio-components/**'
      - 'skills/manifest.json'
      - 'xxxia-studio/projects/sound-club-palma/**'
      - 'xxxia-studio/tests/sound-club-visuals-qa.mjs'
      - '.github/workflows/sound-club-visuals-qa.yml'
  push:
    branches: [main]
    paths:
      - 'projects/mar-salada.html'
      - 'projects/sound-club-palma.html'
      - 'projects/sound-club-visuals.html'
      - 'assets/visuals/sound-club-*.svg'
      - 'assets/visuals/mar-salada-*.svg'
      - 'assets/css/mar-salada-case.css'
      - 'assets/js/mar-salada-case.js'
      - 'assets/css/mar-salada-case-v2.css'
      - 'assets/js/mar-salada-case-v2.js'
      - 'assets/css/sound-club-react-visuals.css'
      - 'assets/js/sound-club-react-visuals.js'
      - 'skills/mar-salada-project/**'
      - 'skills/mar-salada-react-scroll/**'
      - 'skills/react-visuals/**'
      - 'skills/reactbits-portfolio-components/**'
      - 'skills/manifest.json'
      - 'xxxia-studio/projects/sound-club-palma/**'
      - 'xxxia-studio/tests/sound-club-visuals-qa.mjs'
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate registry, story, SVG and skills
        run: |
          python3 - <<'PY'
          import json
          from xml.etree import ElementTree
          m=json.load(open('xxxia-studio/projects/sound-club-palma/05_metadata/project-media.json'))
          assert m['projectId']=='MAR_SALADA_CDM'
          assert m['publicTitle']=='MAR SALADA — CLUB DEL MAR PALMA'
          assert len(m['items']) == 10
          assert sum(1 for x in m['items'] if x['kind']=='BOARD') == 4
          assert sum(1 for x in m['items'] if x['kind']=='PLAN') == 3
          assert sum(1 for x in m['items'] if x['kind']=='DETAIL') == 2
          assert sum(1 for x in m['items'] if x['kind']=='VIDEO') == 0
          assert all(x.get('publicSafe') for x in m['items'])
          assert len({x['id'] for x in m['items']}) == len(m['items'])
          s=json.load(open('xxxia-studio/projects/sound-club-palma/05_metadata/visual-story.json'))
          assert s['schemaVersion'] == 2
          assert len(s['scenes']) == 10
          ids={x['id'] for x in m['items']}
          assert all(x['mediaId'] in ids for x in s['scenes'])
          mo=json.load(open('xxxia-studio/projects/sound-club-palma/05_metadata/motion-manifest.json'))
          assert mo['projectId']=='MAR_SALADA_CDM'
          assert mo['motionId']=='SC08_PORTFOLIO_SCROLL_MASTER'
          assert mo['master']['status'] in {'PENDING_VERIFIED_GEOMETRY','APPROVED'}
          assert len(mo['master']['segments'])==10
          assert {x['storyMediaId'] for x in mo['master']['segments']}=={x['mediaId'] for x in s['scenes']}
          if mo['master']['status']!='APPROVED': assert not mo['master'].get('src')
          model=json.load(open('xxxia-studio/projects/sound-club-palma/05_metadata/model-manifest.json'))
          assert model['projectId']=='MAR_SALADA_CDM'
          assert model['browserFormat']=='glb/gltf'
          assert len(model['models'])==4
          assert all(x['status']=='PENDING_GLB' and not x.get('src') for x in model['models'])
          assert any(x.get('default') for x in model['models'])
          cad=json.load(open('docs/projects/mar-salada/cad-source-manifest.json'))
          assert cad['projectId']=='MAR_SALADA_CDM'
          assert cad['sourcePolicy']=='PRIVATE_SOURCE_FILES_NOT_COMMITTED'
          assert len(cad['files'])==14
          dup=[x for x in cad['dedupe'] if x['group']=='A'][0]
          assert dup['count']==3
          assert sum(1 for x in cad['files'] if x['status']=='DUPLICATE_GROUP_A')==3
          assert all(not x['name'].lower().endswith('.skp') for x in cad['files'])
          for p in [
            'sound-club-zone-plan.svg','sound-club-audio-plan.svg','sound-club-control-plan.svg',
            'sound-club-system.svg','mar-salada-suspension-detail.svg','mar-salada-dj-booth-plan.svg'
          ]:
              ElementTree.parse('assets/visuals/'+p)
          skills=json.load(open('skills/manifest.json'))
          names={x['name'] for x in skills['skills']}
          assert {'mar-salada-project','mar-salada-react-scroll','react-visuals','scroll-world','reactbits-portfolio-components'} <= names
          print('MAR SALADA registry / story / SVG / skills checks pass')
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          python3 -m http.server 4194 --directory . > /tmp/mar-salada-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4194/projects/mar-salada.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/mar-salada-http.log
          exit 1
      - name: Run MAR SALADA React QA
        run: node xxxia-studio/tests/sound-club-visuals-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mar-salada-react-case
          path: .qa/sound-club-visuals/
          if-no-files-found: ignore
          retention-days: 14
