name: Project Atlas / MAR SALADA QA
on:
  pull_request:
    paths:
      - 'projects/mar-salada.html'
      - 'projects/sound-club-palma.html'
      - 'projects/index.html'
      - 'projects/casa-alain.html'
      - 'projects/can-furnet-club.html'
      - 'projects/playa-soleil-bora-bora.html'
      - 'projects/private-production-studio-canada.html'
      - 'projects/private-production-studio-sta-eulalia.html'
      - 'projects/acoustic-studio-italy.html'
      - 'projects/private-producer-acoustic-concept.html'
      - 'assets/css/project-atlas.css'
      - 'assets/js/project-atlas.js'
      - 'assets/visuals/sound-club-*.svg'
      - '.github/workflows/sound-club-visuals-qa.yml'
  push:
    branches: [main]
    paths:
      - 'projects/mar-salada.html'
      - 'projects/sound-club-palma.html'
      - 'projects/index.html'
      - 'projects/casa-alain.html'
      - 'projects/can-furnet-club.html'
      - 'projects/playa-soleil-bora-bora.html'
      - 'projects/private-production-studio-canada.html'
      - 'projects/private-production-studio-sta-eulalia.html'
      - 'projects/acoustic-studio-italy.html'
      - 'projects/private-producer-acoustic-concept.html'
      - 'assets/css/project-atlas.css'
      - 'assets/js/project-atlas.js'
      - 'assets/visuals/sound-club-*.svg'
      - '.github/workflows/sound-club-visuals-qa.yml'

jobs:
  project-atlas-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Project Atlas source boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          project_pages = [
              'projects/mar-salada.html',
              'projects/can-furnet-club.html',
              'projects/playa-soleil-bora-bora.html',
              'projects/private-production-studio-canada.html',
              'projects/private-production-studio-sta-eulalia.html',
              'projects/acoustic-studio-italy.html',
              'projects/private-producer-acoustic-concept.html',
          ]

          atlas = Path('projects/index.html').read_text(encoding='utf-8')
          assert 'PROJECT ATLAS' in atlas
          assert 'source-backed' in atlas.lower()

          for page in project_pages:
              text = Path(page).read_text(encoding='utf-8')
              assert 'window.PROJECT_ATLAS_DATA=' in text, page
              assert '../assets/css/project-atlas.css' in text, page
              assert '../assets/js/project-atlas.js' in text, page
              assert 'boundary' in text.lower(), page

          casa = Path('projects/casa-alain.html').read_text(encoding='utf-8')
          assert '../assets/css/casa-alain-v2.css' in casa
          assert '../assets/js/casa-alain-v2.js' in casa
          assert 'KEF Ci4100QL-THX' in casa
          assert 'No substitute building geometry is introduced' in casa

          mar = Path('projects/mar-salada.html').read_text(encoding='utf-8')
          assert 'MAR SALADA / CLUB DEL MAR' in mar
          assert 'KNX / ETS6' in mar
          assert 'DALI' in mar
          assert 'PREDICTED' in mar
          assert 'CONFIDENTIAL' in mar
          assert 'password' in mar.lower()

          legacy = Path('projects/sound-club-palma.html').read_text(encoding='utf-8')
          assert './mar-salada.html' in legacy

          # Existing sanitized diagrams remain parseable public references.
          for svg in [
              'assets/visuals/sound-club-zone-plan.svg',
              'assets/visuals/sound-club-audio-plan.svg',
              'assets/visuals/sound-club-control-plan.svg',
              'assets/visuals/sound-club-system.svg',
              'assets/visuals/sound-club-suspension-detail.svg',
              'assets/visuals/sound-club-dj-booth-plan.svg',
          ]:
              ElementTree.parse(svg)

          print('Project Atlas / MAR SALADA source-boundary checks pass')
          PY

      - name: Validate Project Atlas JavaScript
        run: |
          node --check assets/js/project-atlas.js
          node --check assets/js/casa-alain-v2.js

      - name: Start preview and smoke-test routes
        run: |
          python3 -m http.server 4194 --directory . >/tmp/project-atlas-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4194/projects/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4194/projects/mar-salada.html | grep -q 'PROJECT_ATLAS_DATA'
          curl -fsS http://127.0.0.1:4194/projects/casa-alain.html | grep -q 'KEF Ci4100QL-THX'
          curl -fsS http://127.0.0.1:4194/projects/can-furnet-club.html | grep -q 'PROJECT_ATLAS_DATA'
          curl -fsS http://127.0.0.1:4194/assets/js/project-atlas.js >/dev/null
          curl -fsS http://127.0.0.1:4194/assets/css/project-atlas.css >/dev/null
