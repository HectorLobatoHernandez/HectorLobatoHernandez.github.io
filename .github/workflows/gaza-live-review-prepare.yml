name: GAZA reviewed lighting and render refinement
on:
  push:
    branches: ['feat/gaza-live-ops-20261012']
    paths: ['.gaza-live-review.mjs', '.github/workflows/gaza-live-review-prepare.yml']
permissions:
  contents: read
jobs:
  reviewed-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'HectorLobatoHernandez/HectorLobatoHernandez.github.io' && github.ref == 'refs/heads/feat/gaza-live-ops-20261012'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .gaza-live-review.mjs apply
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/gaza
      - run: node --test apps/gaza/tests/*.test.mjs
      - run: node .gaza-live-review.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-live-review-${{ github.run_number }}
          path: .qa/live-review/
          include-hidden-files: true
          retention-days: 7
