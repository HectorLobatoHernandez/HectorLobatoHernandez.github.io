name: GAZA presentation realtime QA
on:
  pull_request:
    paths: ['apps/gaza/**','skills/gaza-geospatial-industrial-twin/**','.github/workflows/gaza-presentation-realtime-qa.yml']
  push:
    branches: [main]
    paths: ['apps/gaza/**','skills/gaza-geospatial-industrial-twin/**','.github/workflows/gaza-presentation-realtime-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gaza-presentation-realtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/gaza
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and regression contracts
        run: |
          node --check runtime/time/spain-clock.mjs
          node --check runtime/living/console.mjs
          node --check runtime/living/scene.mjs
          node --check runtime/mobile/scene.mjs
          node --test tests/life-weather-roofs.test.mjs tests/presentation-v2.test.mjs tests/process-ledger.test.mjs tests/farm-life.test.mjs tests/lab-detail.test.mjs tests/site-real-core.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          npm run dev >/tmp/gaza-presentation.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/mission-control.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gaza-presentation.log
          exit 1
      - name: Presentation browser QA
        run: node tests/presentation-v2-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gaza-presentation-realtime-${{ github.run_number }}
          path: apps/gaza/.qa/presentation-v2/
          include-hidden-files: true
          retention-days: 14
